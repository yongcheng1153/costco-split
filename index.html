<style>
:root {
  --blue: #005daa;
  --blue-soft: #e6f0fa;
  --red: #e31837;

* { box-sizing: border-box; }

button { font: inherit; cursor: pointer; }

/* 編輯器 */

/* 結算 */

/* 成員 */

.pill.me { background: #eef1f4; color: var(--muted); }
.pill.paid { background: #e3f5ec; color: var(--green); }

<body>
<div id="root"><div class="center muted">載入中…</div></div>
<script type="module">
import { html, render, useState, useEffect, useMemo, useRef } from 'https://unpkg.com/htm@3.1.1/preact/standalone.module.js';

// ============================================================
// 本機儲存（資料只存在這支手機的瀏覽器裡）
// ============================================================
const LS = {
  get(k, d) {
    try { const v = localStorage.getItem('cs_' + k); return v == null ? d : JSON.parse(v); } catch { return d; }
  },
  set(k, v) {
    try { localStorage.setItem('cs_' + k, JSON.stringify(v)); } catch (e) { alert('儲存失敗：' + e.message); }
  },
};
function usePersist(key, init) {
  const [v, setV] = useState(() => LS.get(key, init));
  useEffect(() => LS.set(key, v), [key, v]);
  return [v, setV];
}

// ============================================================
// 分帳計算（整數新台幣）
// ============================================================
const itemNet = (it) => Math.round((Number(it.amount) || 0) - (Number(it.discount) || 0));
const receiptTotal = (r) => (r.items || []).reduce((s, it) => s + itemNet(it), 0);

// 平分整數金額，零頭依 offset 輪流分配，避免總是同一人多付 1 元
function splitAmount(amount, ids, offset = 0) {
  const n = ids.length, out = {};
  if (!n) return out;
  const sign = amount < 0 ? -1 : 1, abs = Math.abs(amount), base = Math.floor(abs / n);
  let rem = abs - base * n;
  ids.forEach((p) => (out[p] = base));
  for (let i = 0; i < n && rem > 0; i++, rem--) out[ids[(offset + i) % n]] += 1;
  for (const k in out) out[k] *= sign;
  return out;
}
// 每人負擔 { id: 金額 }
function receiptShares(r) {
  const s = {};
  (r.items || []).forEach((it, idx) => {
    for (const [p, v] of Object.entries(splitAmount(itemNet(it), it.assignees || [], idx))) s[p] = (s[p] || 0) + v;
  });
  return s;
}
// 某人的明細 [{ name, net, n, share }]
function personLines(r, id) {
  const out = [];
  (r.items || []).forEach((it, idx) => {
    const a = it.assignees || [];
    if (!a.includes(id)) return;
    out.push({ name: it.name, amount: Number(it.amount) || 0, discount: Number(it.discount) || 0, net: itemNet(it), n: a.length, share: splitAmount(itemNet(it), a, idx)[id] });
  });
  return out;
}
function buildAssignMemory(receipts) {
  const mem = {};
  [...receipts].sort((a, b) => (a.date || '').localeCompare(b.date || '')).forEach((r) =>
    (r.items || []).forEach((it) => { if (it.code && it.assignees?.length) mem[it.code] = it.assignees; }));
  return mem;
}
const fmt = (n) => (Math.round(n) < 0 ? '-' : '') + 'NT$' + Math.abs(Math.round(n)).toLocaleString('zh-TW');
const today = () => new Date().toLocaleDateString('sv-SE');
let seq = 0;
const newId = () => Date.now().toString(36) + (seq++).toString(36) + Math.random().toString(36).slice(2, 5);

// ============================================================
// 收據辨識：直接呼叫 Gemini API（金鑰只存在這支手機）
// ============================================================
const PROMPT = `你是台灣好市多（Costco）收據辨識助手。請讀取照片中的收據，輸出 JSON。

收據格式說明：
- 每個商品通常是兩行：第一行是商品名稱，第二行是「商品編號  數量x  單價  金額 T」。
- 「***COUPON」代表折扣（回饋金），下一行是說明（例如「#1956385回饋金」「IRC FOR #1307818」「身體保養回饋金」），
  再下一行是「折扣編號  1x  金額  金額-T」，金額後面有「-」代表要減掉。
- 折扣說明中的「#數字」就是被折扣商品的商品編號，請把折扣金額合併到該商品的 discount 欄位。
- 若折扣說明沒有商品編號（例如「身體保養回饋金」），就套用到緊接在 COUPON 之前的那個商品。
- 不要把 COUPON 本身當成商品輸出。
- 「預掃描商品開始/結束」、會員編號、發票、付款方式、找零等都不是商品。
- amount 是該商品那一行的金額（數量×單價），discount 是折扣金額（正數），沒有折扣就填 0。
- 若收據上有總計／應付金額，填入 printedTotal；沒有或看不到就填 0。
- 日期格式 YYYY-MM-DD，看不到就填空字串。
- 看不清楚的字請盡量推測，但不要捏造不存在的商品。`;

const SCHEMA = {
  type: 'OBJECT',
  properties: {
    store: { type: 'STRING' },
    date: { type: 'STRING' },
    printedTotal: { type: 'NUMBER' },
    items: {
      type: 'ARRAY',
      items: {
        type: 'OBJECT',
        properties: {
          name: { type: 'STRING' }, code: { type: 'STRING' }, qty: { type: 'NUMBER' },
          amount: { type: 'NUMBER' }, discount: { type: 'NUMBER' },
        },
        required: ['name', 'code', 'amount', 'discount'],
      },
    },
  },
  required: ['items'],
};

// 用「串流」方式呼叫：Google 一邊產生一邊傳回來，連線不會因為久久沒資料被 Safari 切斷
async function callGemini({ key, model, parts, json, thinking, timeoutMs }) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  const t0 = performance.now();
  const secs = () => Math.round((performance.now() - t0) / 1000);
  try {
    const generationConfig = { temperature: 0 };
    if (json) Object.assign(generationConfig, { responseMimeType: 'application/json', responseSchema: SCHEMA });
    if (thinking) generationConfig.thinkingConfig = thinking;
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:streamGenerateContent?alt=sse`, {
      method: 'POST',
      signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({ contents: [{ role: 'user', parts }], generationConfig }),
    });
    if (!r.ok) {
      const data = await r.json().catch(() => ({}));
      const e = new Error(data?.error?.message || `HTTP ${r.status}`);
      e.status = r.status;
      throw e;
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '', text = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim();
        buf = buf.slice(i + 1);
        if (!line.startsWith('data:')) continue;
        try {
          const d = JSON.parse(line.slice(5));
          if (d.error) { const e = new Error(d.error.message); e.status = d.error.code; throw e; }
          for (const p of d?.candidates?.[0]?.content?.parts || []) if (!p.thought) text += p.text || '';
        } catch (e) {
          if (e.status) throw e;
        }
      }
    }
    if (!text) throw Object.assign(new Error('Gemini 沒有回傳內容'), { status: 503 });
    return text;
  } catch (e) {
    if (e.name === 'AbortError') throw Object.assign(new Error(`超過 ${timeoutMs / 1000} 秒沒有回應`), { status: 504 });
    if (!e.status) { // 網路中斷（Safari 顯示 Load failed）
      e.status = 599;
      e.message = `連線中斷（${secs()} 秒）：${e.message}`;
    }
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

// 模型忙碌（503/429/500）或不存在（404）時，等一下再換下一個模型
const FALLBACK_MODELS = ['gemini-flash-latest', 'gemini-flash-lite-latest', 'gemini-2.5-flash', 'gemini-2.5-flash-lite'];
const sleep = (ms) => new Promise((ok) => setTimeout(ok, ms));
const isBusy = (e) => [429, 500, 503, 504, 599].includes(e.status) || /overload|high demand|unavailable|try again/i.test(e.message || '');
async function withModels(settings, onStep, run) {
  const models = [...new Set([settings.model || 'gemini-flash-latest', ...FALLBACK_MODELS])];
  let lastErr;
  for (const [i, model] of models.entries()) {
    // 同一個模型忙碌時先重試一次
    for (let retry = 0; retry < 2; retry++) {
      try {
        const out = await run(model);
        return { out, model };
      } catch (e) {
        lastErr = e;
        if (e.status === 404 || /not found|not supported for generateContent/i.test(e.message || '')) break; // 模型不存在 → 換下一個
        if (!isBusy(e)) throw e; // 金鑰錯誤等問題，換模型也沒用
        if (retry === 0) { onStep(`${model} 忙碌中，3 秒後重試`); await sleep(3000); }
      }
    }
    if (i < models.length - 1) onStep(`改用 ${models[i + 1]}`);
  }
  throw lastErr;
}

async function parseReceipt(images, settings, onStep) {
  if (!settings.geminiKey) throw new Error('還沒設定 Gemini 金鑰，請到「設定」頁貼上。');
  const parts = [
    { text: PROMPT + (images.length > 1 ? '\n\n以下多張照片是同一張收據的不同段落（依序），重疊的部分不要重複計算。' : '') },
    ...images.map((im) => ({ inlineData: { mimeType: 'image/jpeg', data: im.data } })),
  ];
  onStep('辨識中');
  const { out: p } = await withModels(settings, onStep, async (model) => {
    // 關掉「思考」以加快速度：Gemini 3 用 thinkingLevel、Gemini 2.5 用 thinkingBudget，都不支援就用預設
    const options = [{ thinkingLevel: 'MINIMAL' }, { thinkingBudget: 0 }, null];
    let err;
    for (const thinking of options) {
      try {
        return JSON.parse(await callGemini({ key: settings.geminiKey, model, parts, json: true, thinking, timeoutMs: 120000 }));
      } catch (e) {
        err = e;
        if (e.status !== 400) throw e;
      }
    }
    throw err;
  });
  return {
    store: p.store || '',
    date: /^\d{4}-\d{2}-\d{2}$/.test(p.date || '') ? p.date : '',
    printedTotal: Math.round(Number(p.printedTotal) || 0),
    items: (p.items || []).map((it) => ({
      name: String(it.name || '').trim(),
      code: String(it.code || '').trim(),
      qty: Number(it.qty) || 1,
      amount: Math.round(Number(it.amount) || 0),
      discount: Math.abs(Math.round(Number(it.discount) || 0)),
    })).filter((it) => it.name || it.amount),
  };
}

async function fileToJpeg(file, maxSide) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, bad) => {
      const i = new Image();
      i.onload = () => ok(i);
      i.onerror = () => bad(new Error('無法讀取圖片'));
      i.src = url;
    });
    const s = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.naturalWidth * s);
    cv.height = Math.round(img.naturalHeight * s);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    const dataUrl = cv.toDataURL('image/jpeg', 0.82);
    return { data: dataUrl.split(',')[1], preview: dataUrl };
  } finally {
    URL.revokeObjectURL(url);
  }
}

// ============================================================
// 分享圖片（用 canvas 畫出來）
// ============================================================
const FONT = '-apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif';
function ellipsis(ctx, text, maxW) {
  if (ctx.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}

// sections: [{ kind:'person', name, amount, lines } ] 或 總表
function drawImage({ title, subtitle, hero, heroLabel, rows, footer }) {
  const W = 1080, PAD = 64, ROW = 112;
  const H = 360 + (hero ? 200 : 0) + rows.length * ROW + 200;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  c.fillStyle = '#f3f5f8'; c.fillRect(0, 0, W, H);
  // 頂部
  c.fillStyle = '#005daa'; c.fillRect(0, 0, W, 220);
  c.fillStyle = '#fff';
  c.font = `800 60px ${FONT}`; c.fillText(title, PAD, 110);
  c.font = `400 36px ${FONT}`; c.globalAlpha = 0.85; c.fillText(subtitle, PAD, 170); c.globalAlpha = 1;
  // 卡片
  const top = 260;
  c.fillStyle = '#fff';
  c.beginPath(); (c.roundRect ? c.roundRect(PAD - 24, top - 20, W - (PAD - 24) * 2, H - top - 120, 36) : c.rect(PAD - 24, top - 20, W - (PAD - 24) * 2, H - top - 120)); c.fill();
  let y = top + 50;
  if (hero) {
    c.fillStyle = '#6b7684'; c.font = `500 38px ${FONT}`; c.fillText(heroLabel, PAD + 16, y + 10);
    c.fillStyle = '#e31837'; c.font = `900 110px ${FONT}`; c.fillText(hero, PAD + 16, y + 130);
    y += 200;
    c.strokeStyle = '#e3e7ec'; c.lineWidth = 3; c.beginPath(); c.moveTo(PAD + 16, y - 20); c.lineTo(W - PAD - 16, y - 20); c.stroke();
  }
  for (const r of rows) {
    c.textAlign = 'left';
    c.fillStyle = '#1c2430'; c.font = `${r.bold ? 800 : 500} 40px ${FONT}`;
    c.fillText(ellipsis(c, r.left, W - PAD * 2 - 300), PAD + 16, y + 36);
    if (r.note) { c.fillStyle = '#6b7684'; c.font = `400 30px ${FONT}`; c.fillText(ellipsis(c, r.note, W - PAD * 2 - 300), PAD + 16, y + 76); }
    c.textAlign = 'right';
    c.fillStyle = r.color || '#1c2430'; c.font = `${r.bold ? 900 : 700} 42px ${FONT}`;
    c.fillText(r.right, W - PAD - 16, y + 36);
    if (r.rightNote) { c.fillStyle = '#9aa3ad'; c.font = `400 28px ${FONT}`; c.fillText(r.rightNote, W - PAD - 16, y + 76); }
    y += ROW;
  }
  c.textAlign = 'center'; c.fillStyle = '#6b7684'; c.font = `500 34px ${FONT}`;
  c.fillText(footer, W / 2, H - 50);
  return cv;
}

function personImage(r, person, me) {
  const lines = personLines(r, person.id);
  const total = lines.reduce((s, l) => s + l.share, 0);
  return drawImage({
    title: `🧾 好市多分帳`,
    subtitle: `${r.date}${r.store ? '・' + r.store : ''}・給 ${person.name}`,
    heroLabel: `${person.name} 應付`,
    hero: fmt(total),
    rows: lines.map((l) => ({
      left: l.name,
      note: [l.discount ? `原價 ${l.amount} − 折扣 ${l.discount} = ${l.net}` : '', l.n > 1 ? `${l.n} 人平分` : ''].filter(Boolean).join('・'),
      right: fmt(l.share),
    })),
    footer: `共 ${lines.length} 項・請付給 ${me}`,
  });
}

function summaryImage(r, people, me, meId) {
  const shares = receiptShares(r);
  const owe = people.filter((p) => p.id !== meId && shares[p.id]);
  return drawImage({
    title: `🧾 好市多分帳`,
    subtitle: `${r.date}${r.store ? '・' + r.store : ''}・總計 ${fmt(receiptTotal(r))}`,
    rows: [
      ...people.filter((p) => shares[p.id]).map((p) => ({
        left: p.name + (p.id === meId ? '（我先付）' : ''),
        note: `${personLines(r, p.id).length} 項`,
        right: fmt(shares[p.id]),
        color: p.id === meId ? '#6b7684' : '#e31837',
        bold: true,
      })),
    ],
    footer: owe.length ? `以上金額請付給 ${me}` : '沒有需要收款的人',
  });
}

async function shareCanvas(cv, filename, setPreview) {
  const blob = await new Promise((ok) => cv.toBlob(ok, 'image/png'));
  const file = new File([blob], filename, { type: 'image/png' });
  if (navigator.canShare?.({ files: [file] })) {
    try {
      await navigator.share({ files: [file] });
      return;
    } catch (e) {
      if (e.name === 'AbortError') return; // 使用者取消
    }
  }
  setPreview(URL.createObjectURL(blob)); // 不支援分享就顯示圖片，長按儲存
}

const ME = 'me';
function App() {
  const [people, setPeople] = usePersist('people', [{ id: ME, name: '我' }]);
  const [receipts, setReceipts] = usePersist('receipts', []);
  const [settings, setSettings] = usePersist('settings', { geminiKey: '', model: 'gemini-flash-latest' });
  const [view, setView] = useState({ name: settings.geminiKey ? 'list' : 'settings' });

  const nameOf = (id) => people.find((p) => p.id === id)?.name || '（已刪除）';
  const saveReceipt = (r) => {
    setReceipts((xs) => (xs.some((x) => x.id === r.id) ? xs.map((x) => (x.id === r.id ? r : x)) : [r, ...xs])
      .sort((a, b) => (b.date || '').localeCompare(a.date || '')));
  };

  if (view.name === 'edit')
    return html`<${Editor} initial=${view.receipt} people=${people} receipts=${receipts} settings=${settings}
      onCancel=${() => setView({ name: 'list' })}
      onSave=${(r) => { saveReceipt(r); setView({ name: 'share', id: r.id }); }}
      onDelete=${(id) => { setReceipts((xs) => xs.filter((x) => x.id !== id)); setView({ name: 'list' }); }} />`;

  if (view.name === 'share') {
    const r = receipts.find((x) => x.id === view.id);
    if (r) return html`<${Share} r=${r} people=${people} nameOf=${nameOf}
      onBack=${() => setView({ name: 'list' })} onEdit=${() => setView({ name: 'edit', receipt: r })}
      onPaid=${(pid) => saveReceipt({ ...r, paid: { ...(r.paid || {}), [pid]: !r.paid?.[pid] } })} />`;
  }

  return html`<div class="app">
    <header class="topbar"><div class="title">🧾 好市多分帳</div></header>
    <main>
      ${view.name === 'settings'
        ? html`<${Settings} people=${people} setPeople=${setPeople} settings=${settings} setSettings=${setSettings} receipts=${receipts} setReceipts=${setReceipts} />`
        : html`<${List} receipts=${receipts} people=${people} nameOf=${nameOf}
            onNew=${() => (settings.geminiKey ? setView({ name: 'edit', receipt: null }) : setView({ name: 'settings' }))}
            onOpen=${(r) => setView({ name: 'share', id: r.id })} />`}
    </main>
    <nav class="tabs">
      <button class=${view.name === 'list' ? 'on' : ''} onClick=${() => setView({ name: 'list' })}><span>🧾</span>收據</button>
      <button class=${view.name === 'settings' ? 'on' : ''} onClick=${() => setView({ name: 'settings' })}><span>⚙️</span>設定</button>
    </nav>
  </div>`;
}

// ---------- 收據列表 ----------
function List({ receipts, people, nameOf, onNew, onOpen }) {
  return html`
    <button class="btn primary block big" onClick=${onNew}>📷 新增收據</button>
    ${receipts.length === 0 && html`<p class="center muted">還沒有收據。拍下好市多收據開始分帳吧！</p>`}
    <ul class="list">
      ${receipts.map((r) => {
        const shares = receiptShares(r);
        const owing = Object.keys(shares).filter((id) => id !== ME && shares[id] > 0);
        const unpaid = owing.filter((id) => !r.paid?.[id]);
        return html`<li key=${r.id} class="card receipt" onClick=${() => onOpen(r)}>
          <div class="row between">
            <div><b>${r.date}</b> <span class="muted">${r.store}</span></div>
            <b class="amount">${fmt(receiptTotal(r))}</b>
          </div>
          <div class="shares">
            ${Object.entries(shares).map(([id, v]) => html`<span key=${id}
              class=${'pill ' + (id === ME ? 'me' : r.paid?.[id] ? 'paid' : '')}>${r.paid?.[id] ? '✓ ' : ''}${nameOf(id)} ${fmt(v)}</span>`)}
          </div>
          ${owing.length > 0 && html`<div class="small ${unpaid.length ? 'warn' : 'ok'}" style="margin-top:6px">
            ${unpaid.length ? `待收款 ${unpaid.length} 人` : '✓ 全部已收款'}</div>`}
        </li>`;
      })}
    </ul>`;
}

// ---------- 新增／編輯收據 ----------
function Editor({ initial, people, receipts, settings, onCancel, onSave, onDelete }) {
  const [date, setDate] = useState(initial?.date || today());
  const [store, setStore] = useState(initial?.store || '');
  const [items, setItems] = useState(() => (initial?.items || []).map((it) => ({ ...it, _id: newId() })));
  const [printedTotal, setPrintedTotal] = useState(initial?.printedTotal || 0);
  const [previews, setPreviews] = useState([]);
  const [busy, setBusy] = useState(false);
  const [step, setStep] = useState('');
  const [elapsed, setElapsed] = useState(0);
  const [err, setErr] = useState('');
  const fileRef = useRef();
  const memory = useMemo(() => buildAssignMemory(receipts), [receipts]);
  const ids = people.map((p) => p.id);

  useEffect(() => {
    if (!busy) return;
    setElapsed(0);
    const t = setInterval(() => setElapsed((x) => x + 1), 1000);
    return () => clearInterval(t);
  }, [busy]);

  const total = receiptTotal({ items });
  const shares = receiptShares({ items });
  const unassigned = items.filter((it) => !it.assignees?.length).length;
  const mismatch = printedTotal > 0 && items.length > 0 && Math.abs(printedTotal - total) >= 1;

  async function onFiles(e) {
    const files = [...(e.target.files || [])].slice(0, 4);
    e.target.value = '';
    if (!files.length) return;
    setErr(''); setBusy(true); setStep('準備照片');
    try {
      const imgs = await Promise.all(files.map((f) => fileToJpeg(f, files.length > 1 ? 1400 : 1600)));
      setPreviews(imgs.map((i) => i.preview));
      const data = await parseReceipt(imgs, settings, setStep);
      if (data.date) setDate(data.date);
      if (data.store) setStore(data.store);
      setPrintedTotal(data.printedTotal);
      setItems(data.items.map((it) => {
        const remembered = (memory[it.code] || []).filter((x) => ids.includes(x));
        return { ...it, _id: newId(), assignees: remembered, _remembered: remembered.length > 0 };
      }));
      if (!data.items.length) setErr('沒有辨識到品項，請重拍或手動輸入');
    } catch (e2) {
      const m = String(e2.message || e2);
      setErr(/API key|API_KEY/i.test(m) ? '辨識失敗：Gemini 金鑰無效，請到「設定」重新貼上。'
        : isBusy(e2) ? '辨識失敗：Google 的模型都太忙了，請過幾分鐘再按一次（照片不用重拍，直接重新選即可）。'
        : '辨識失敗：' + m);
    } finally {
      setBusy(false);
    }
  }

  const patch = (id, p) => setItems((xs) => xs.map((x) => (x._id === id ? { ...x, ...p } : x)));
  const toggle = (id, pid) => setItems((xs) => xs.map((x) => {
    if (x._id !== id) return x;
    const a = new Set(x.assignees || []);
    a.has(pid) ? a.delete(pid) : a.add(pid);
    return { ...x, assignees: ids.filter((i) => a.has(i)), _remembered: false };
  }));
  const fillUnassigned = (list) => setItems((xs) => xs.map((x) => (x.assignees?.length ? x : { ...x, assignees: [...list] })));
  const addItem = () => setItems((xs) => [...xs, { _id: newId(), name: '', code: '', qty: 1, amount: 0, discount: 0, assignees: [] }]);

  function save() {
    if (!items.length) return setErr('至少要有一個品項');
    if (unassigned) return setErr(`還有 ${unassigned} 個品項沒有指派給任何人`);
    onSave({
      id: initial?.id || newId(),
      date, store: store.trim(), printedTotal: Number(printedTotal) || 0,
      paid: initial?.paid || {},
      items: items.map(({ name, code, qty, amount, discount, assignees }) => ({
        name: (name || '').trim() || '（未命名）', code: (code || '').trim(), qty: Number(qty) || 1,
        amount: Math.round(Number(amount) || 0), discount: Math.round(Number(discount) || 0), assignees: assignees || [],
      })),
    });
  }

  return html`<div class="app editor">
    <header class="topbar">
      <button class="link" onClick=${onCancel}>← 返回</button>
      <div class="title">${initial ? '編輯收據' : '新增收據'}</div>
      ${initial ? html`<button class="link danger" onClick=${() => confirm('確定刪除這張收據？') && onDelete(initial.id)}>刪除</button>` : html`<span style="width:40px"></span>`}
    </header>
    <main>
      <section class="card">
        <h3>① 收據照片</h3>
        <input ref=${fileRef} type="file" accept="image/*" multiple hidden onChange=${onFiles} />
        <div class="row gap">
          <button class="btn primary" disabled=${busy} onClick=${() => fileRef.current.click()}>📷 ${items.length ? '重新拍照辨識' : '拍照／選擇照片'}</button>
          ${!items.length && html`<button class="btn" onClick=${addItem}>手動輸入</button>`}
        </div>
        <p class="hint">收據太長可以分段拍，一次選最多 4 張。辨識後請核對金額。</p>
        ${previews.length > 0 && html`<div class="previews">${previews.map((p) => html`<img src=${p} />`)}</div>`}
        ${busy && html`<div class="loading">${step}… ${elapsed} 秒<br /><small>請停留在這個畫面，不要切換 App 或鎖螢幕</small></div>`}
        <div class="row gap fields">
          <label>日期<input type="date" value=${date} onInput=${(e) => setDate(e.target.value)} /></label>
          <label>分店／備註<input value=${store} placeholder="例：台南店" onInput=${(e) => setStore(e.target.value)} /></label>
        </div>
      </section>

      ${items.length > 0 && html`<section class="card">
        <h3>② 品項是誰的？</h3>
        <div class="quick">
          <span class="muted">未指派的全部給：</span>
          <div class="chips">
            ${people.map((p) => html`<button key=${p.id} class="chip small" onClick=${() => fillUnassigned([p.id])}>${p.name}</button>`)}
            <button class="chip small" onClick=${() => fillUnassigned(ids)}>全員平分</button>
          </div>
        </div>
        <ul class="items">
          ${items.map((it) => {
            const net = itemNet(it), n = it.assignees?.length || 0;
            return html`<li key=${it._id} class=${n === 0 ? 'item unassigned' : 'item'}>
              <div class="item-top">
                <input class="name" value=${it.name} placeholder="品名" onInput=${(e) => patch(it._id, { name: e.target.value })} />
                <button class="x" title="刪除品項" onClick=${() => setItems((xs) => xs.filter((x) => x._id !== it._id))}>✕</button>
              </div>
              <div class="item-nums">
                <label>金額<input type="number" inputmode="numeric" value=${it.amount} onInput=${(e) => patch(it._id, { amount: e.target.value })} /></label>
                <label>折扣<input type="number" inputmode="numeric" value=${it.discount} onInput=${(e) => patch(it._id, { discount: e.target.value })} /></label>
                <div class="net"><small>實付</small><b>${fmt(net)}</b>${Number(it.discount) > 0 && html`<s>${fmt(it.amount)}</s>`}</div>
              </div>
              <div class="chips">
                ${people.map((p) => html`<button key=${p.id} class=${'chip ' + (it.assignees?.includes(p.id) ? 'on' : '')} onClick=${() => toggle(it._id, p.id)}>${p.name}</button>`)}
                <button class="chip ghost" onClick=${() => patch(it._id, { assignees: [...ids], _remembered: false })}>全員</button>
              </div>
              <div class="item-foot">
                ${it.code && html`<span class="code">#${it.code}</span>`}
                ${it._remembered && html`<span class="tag">依上次分配</span>`}
                ${n > 1 && html`<span class="muted">每人約 ${fmt(net / n)}</span>`}
                ${n === 0 && html`<span class="warn">尚未指派</span>`}
              </div>
            </li>`;
          })}
        </ul>
        <button class="btn block" onClick=${addItem}>＋ 新增品項</button>
      </section>`}
      <div style="height:190px"></div>
    </main>
    <footer class="summary">
      <div class="sum-row">
        <span>合計 <b>${fmt(total)}</b>${printedTotal > 0 && html` <small class="muted">（收據 ${fmt(printedTotal)}）</small>`}</span>
      </div>
      ${mismatch && html`<div class="warn">⚠ 合計與收據總額不符，請檢查是否有漏掉或辨識錯的品項</div>`}
      <div class="sum-people">
        ${Object.entries(shares).map(([id, v]) => html`<span key=${id}>${people.find((p) => p.id === id)?.name} <b>${fmt(v)}</b></span>`)}
        ${unassigned > 0 && html`<span class="warn">未指派 ${unassigned} 項</span>`}
      </div>
      ${err && html`<div class="error">${err}</div>`}
      <button class="btn primary block" disabled=${busy || !items.length} onClick=${save}>儲存並產生分享圖</button>
    </footer>
  </div>`;
}

function Share({ r, people, nameOf, onBack, onEdit, onPaid }) {
  const [preview, setPreview] = useState(null);
  const me = nameOf(ME);
  const shares = receiptShares(r);
  const involved = people.filter((p) => shares[p.id]);
  const others = involved.filter((p) => p.id !== ME);
  const fname = (who) => `好市多分帳_${r.date}_${who}.png`;

  return html`<div class="app">
    <header class="topbar">
      <button class="link" onClick=${onBack}>← 收據</button>
      <div class="title">${r.date}</div>
      <button class="link" onClick=${onEdit}>編輯</button>
    </header>
    <main>
      <section class="card">
        <div class="row between"><h3 style="margin:0">💸 每個人應付</h3><b class="amount">${fmt(receiptTotal(r))}</b></div>
        <p class="hint" style="margin-bottom:10px">${r.store || ''} 共 ${r.items.length} 項，由 ${me} 先付</p>
        <ul class="debts">
          ${others.map((p) => html`<li key=${p.id} class=${'debt ' + (r.paid?.[p.id] ? 'done' : 'mine')}>
            <div class="debt-line"><b>${p.name}</b><span class="muted small">${personLines(r, p.id).length} 項</span>
              <span class="amount">${fmt(shares[p.id])}</span></div>
            <div class="row gap">
              <button class="btn primary" onClick=${() => shareCanvas(personImage(r, p, me), fname(p.name), setPreview)}>📤 分享明細給 ${p.name}</button>
              <button class="btn" onClick=${() => onPaid(p.id)}>${r.paid?.[p.id] ? '✓ 已收款' : '標記已收款'}</button>
            </div>
          </li>`)}
          ${shares[ME] ? html`<li class="debt"><div class="debt-line"><b>${me}</b><span class="muted small">自己負擔</span>
            <span class="amount" style="color:var(--muted)">${fmt(shares[ME])}</span></div></li>` : ''}
        </ul>
        ${others.length > 0 && html`<button class="btn block" style="margin-top:6px"
          onClick=${() => shareCanvas(summaryImage(r, involved, me, ME), fname('總表'), setPreview)}>📤 分享總表（全部人的金額）</button>`}
        ${others.length === 0 && html`<p class="muted">這張收據都是自己的，不用收款。</p>`}
      </section>

      <section class="card">
        <h3>🧾 明細</h3>
        <table class="stats">
          <tbody>
            ${r.items.map((it) => html`<tr>
              <td style="white-space:normal">${it.name}<div class="muted small">${(it.assignees || []).map(nameOf).join('、')}</div></td>
              <td>${fmt(itemNet(it))}${it.discount ? html`<div class="muted small"><s>${fmt(it.amount)}</s></div>` : ''}</td>
            </tr>`)}
          </tbody>
        </table>
      </section>
    </main>
    ${preview && html`<div class="modal" onClick=${() => setPreview(null)}>
      <p>長按圖片可儲存或分享</p>
      <img src=${preview} onClick=${(e) => e.stopPropagation()} />
      <button class="btn modal-close" onClick=${() => setPreview(null)}>✕ 關閉</button>
    </div>`}
  </div>`;
}

// ---------- 設定 ----------
function Settings({ people, setPeople, settings, setSettings, receipts }) {
  const [newName, setNewName] = useState('');
  const [key, setKey] = useState(settings.geminiKey || '');
  const [model, setModel] = useState(settings.model || 'gemini-flash-latest');
  const [test, setTest] = useState('');

  const used = new Set(receipts.flatMap((r) => r.items.flatMap((i) => i.assignees || [])));
  function addPerson(e) {
    e.preventDefault();
    const n = newName.trim();
    if (!n) return;
    if (people.some((p) => p.name === n)) return alert('已經有這個名字了');
    setPeople([...people, { id: newId(), name: n }]);
    setNewName('');
  }
  function rename(p) {
    const n = prompt('新的名字', p.name);
    if (n && n.trim()) setPeople(people.map((x) => (x.id === p.id ? { ...x, name: n.trim() } : x)));
  }
  function remove(p) {
    if (used.has(p.id) && !confirm(`${p.name} 在舊收據中有品項，刪除後舊收據會顯示「（已刪除）」。確定刪除？`)) return;
    setPeople(people.filter((x) => x.id !== p.id));
  }
  async function saveKey() {
    const k = key.trim();
    setSettings({ ...settings, geminiKey: k, model: model.trim() || 'gemini-flash-latest' });
    if (!k) return setTest('');
    setTest('測試中…');
    const s = performance.now();
    try {
      const { out: t, model: used } = await withModels({ model: model.trim() }, (m) => setTest('測試中… ' + m), (m) =>
        callGemini({ key: k, model: m, parts: [{ text: '請只回覆兩個字：正常' }], timeoutMs: 45000 }));
      setTest(`✅ 金鑰可用（模型 ${used}），Gemini 回覆「${t.trim().slice(0, 10)}」（${((performance.now() - s) / 1000).toFixed(1)} 秒）`);
    } catch (e) {
      setTest(`❌ 失敗（${((performance.now() - s) / 1000).toFixed(1)} 秒）：${e.message}` +
        (isBusy(e) ? '\n\n→ 金鑰沒問題，是 Google 的模型暫時太忙，過幾分鐘再試即可。' : ''));
    }
  }

  return html`
    <section class="card">
      <h3>👥 分帳的人</h3>
      <ul class="members">
        ${people.map((p) => html`<li key=${p.id}>
          <div><b>${p.name}</b> ${p.id === ME && html`<span class="tag">我・先付錢的人</span>`}</div>
          <div class="row gap">
            <button class="link" onClick=${() => rename(p)}>改名</button>
            ${p.id !== ME && html`<button class="link danger" onClick=${() => remove(p)}>刪除</button>`}
          </div>
        </li>`)}
      </ul>
      <form class="row gap" style="margin-top:10px" onSubmit=${addPerson}>
        <input class="grow" placeholder="新增一個人的名字" value=${newName} onInput=${(e) => setNewName(e.target.value)} />
        <button class="btn primary">新增</button>
      </form>
      <p class="hint">「我」的名字會出現在分享圖片上（請付給 ○○），建議改成你的名字。</p>
    </section>

    <section class="card">
      <h3>🔑 Gemini 金鑰（收據辨識用）</h3>
      <input class="full" type="password" placeholder="貼上 AIza 開頭的金鑰" value=${key} onInput=${(e) => setKey(e.target.value)} />
      <details style="margin-top:8px"><summary class="muted small">進階：模型名稱</summary>
        <input class="full" value=${model} onInput=${(e) => setModel(e.target.value)} />
      </details>
      <button class="btn primary block" style="margin-top:10px" onClick=${saveKey}>儲存並測試</button>
      ${test && html`<pre class="diag">${test}</pre>`}
      <p class="hint">金鑰只存在這支手機的瀏覽器裡，不會放進網頁或 GitHub。
        到 <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a> 免費申請。</p>
    </section>

    <section class="card">
      <h3>💾 資料</h3>
      <p class="hint" style="margin-top:0">所有收據只存在這支手機。換手機或清除瀏覽器資料前，請先匯出備份。</p>
      <div class="row gap">
        <button class="btn" onClick=${exportData}>匯出備份</button>
        <button class="btn" onClick=${importData}>匯入備份</button>
      </div>
    </section>`;
}

function exportData() {
  const data = { people: LS.get('people', []), receipts: LS.get('receipts', []), v: 1 };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `好市多分帳備份_${today()}.json`;
  a.click();
}
function importData() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'application/json,.json';
  inp.onchange = async () => {
    try {
      const d = JSON.parse(await inp.files[0].text());
      if (!Array.isArray(d.people) || !Array.isArray(d.receipts)) throw new Error('格式不符');
      if (!confirm(`匯入 ${d.receipts.length} 張收據，會取代目前資料，確定？`)) return;
      LS.set('people', d.people);
      LS.set('receipts', d.receipts);
      location.reload();
    } catch (e) {
      alert('匯入失敗：' + e.message);
    }
  };
  inp.click();
}

render(html`<${App} />`, document.getElementById('root'));

</script>
</body>
</html>
